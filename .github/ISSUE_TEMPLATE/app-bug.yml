name: Bug in the app
description: Chaos Conductor itself isn't behaving as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown next to the app name at the top of the screen, e.g. v2.77.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g. Chrome 130 on Windows 11, Safari on iPhone 15.
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio or MIDI device
      description: Optional. Helpful for crackling, latency or MIDI problems.
